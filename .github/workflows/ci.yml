name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Linux scrollbars take layout space, so the width:100vw case runs here as a
    # true positive rather than the conditional skip it becomes on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # docs/ is the published demo. Regenerate it and fail if it drifted from content.js.
      - run: npm run build:docs
      - run: git diff --exit-code -- docs/overflow-x-culprit.js
